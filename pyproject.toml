[project]
name = "videoexplainer"
version = "0.1.0"
description = "Explainer videos from First Aid topics, written by Claude Code, narrated by Kokoro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "manim>=0.21.0",
    "numpy>=2.5.3",
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.6",
    "soundfile>=0.14.0",
    "transformers>=4.45",
    "typer>=0.27.2",
]

[project.scripts]
vx = "videoexplainer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoexplainer"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
